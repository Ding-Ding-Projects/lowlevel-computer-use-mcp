name: Test and publish release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run unit suite
        run: uv run python -m unittest discover -s tests -v

  release:
    name: Build wheel and publish one release
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build installable artifacts
        run: uv build
      - name: Publish uniquely tagged release
        shell: bash
        run: |
          tag="automation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Automated release ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Tests passed on Windows and Linux for commit ${GITHUB_SHA}."
