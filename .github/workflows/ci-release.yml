name: Build and publish release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  release:
    name: Build unsigned Windows packages and publish one release
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Python package through root bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .agent/build-logs | Out-Null
          & .\build.bat 2>&1 | Tee-Object .agent/build-logs/build.log
          exit $LASTEXITCODE
      - name: Resolve bundled release code name outside source
        shell: pwsh
        run: |
          $used = Join-Path $env:RUNNER_TEMP 'used-release-notes.txt'
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].body'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes | Set-Content -LiteralPath $used -Encoding utf8
          & .venv/Scripts/python.exe scripts/resolve_release_codename.py --catalog docs/features/releases/catalog/index.json --used-notes $used --output "$env:RUNNER_TEMP/release-codename.json"
          exit $LASTEXITCODE
      - name: Build unsigned Squirrel installer through root entrypoint
        shell: pwsh
        run: |
          & .\build-installer.bat -ReleaseCodename "$env:RUNNER_TEMP/release-codename.json" 2>&1 | Tee-Object .agent/build-logs/installer.log
          exit $LASTEXITCODE
      - name: Publish unique normal release
        shell: pwsh
        run: |
          $receipts = @(Get-ChildItem dist/installer -Recurse -Filter receipt.json)
          if ($receipts.Count -ne 1) { throw 'Expected exactly one current installer receipt' }
          $receipt = Get-Content -Raw $receipts[0].FullName | ConvertFrom-Json
          if ($receipt.exitCode -ne 0 -or -not $receipt.sourceUnchanged -or $receipt.source -cne $env:GITHUB_SHA) { throw 'Installer receipt does not bind current source' }
          $codename = Get-Content -Raw "$env:RUNNER_TEMP/release-codename.json" | ConvertFrom-Json
          $started = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" --jq '[.jobs[].started_at] | min'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workflowStart = [DateTimeOffset]::Parse($started)
          $tag = "automation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          & .venv/Scripts/python.exe scripts/count_lines.py --markdown | Set-Content -LiteralPath $notes -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $photo = 'docs/features/releases/catalog/hk-dish-0001-classic-har-gow.png'
          & .venv/Scripts/python.exe -c "from PIL import Image; Image.open('$photo').verify()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $notes -Encoding utf8 -Value "`nCode name: $($codename.codeName)`nSource commit: $env:GITHUB_SHA`nCatalog photo: Classic Har Gow, hk-dish-0001-classic-har-gow.png`n`nThe Windows Squirrel assets are unsigned and may trigger unknown-publisher or SmartScreen warnings. No workflow tests or lint were run. Package production does not prove installed runtime acceptance."
          $assets = @((Get-ChildItem dist -Filter '*.whl').FullName) + @($receipt.assets | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_.path }) + @($photo)
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Automated release $env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $completed = [DateTimeOffset]::UtcNow
          $duration = ($completed - $workflowStart).ToString('hh\:mm\:ss')
          Add-Content -LiteralPath $notes -Encoding utf8 -Value "`nWorkflow started: $($workflowStart.ToString('yyyy-MM-ddTHH:mm:ssZ'))`nWorkflow completed: $($completed.ToString('yyyy-MM-ddTHH:mm:ssZ'))`nWorkflow duration: $duration"
          gh release edit $tag --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $tag --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release | Set-Content .agent/build-logs/release.json -Encoding utf8
          $proof = $release | ConvertFrom-Json
          if ($proof.isDraft -or $proof.isPrerelease) { throw 'Release must be normal' }
          $target = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($target -cne "commit:$env:GITHUB_SHA") { throw 'Release tag source mismatch' }
          $expected = @($assets | ForEach-Object { Split-Path -Leaf $_ })
          foreach ($name in $expected) { if ($name -notin $proof.assets.name) { throw "Missing release asset: $name" } }
      - name: Collect safe producer context even after failure
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .agent/build-logs | Out-Null
          @{ source=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; jobStatus='${{ job.status }}'; runnerOs=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH } | ConvertTo-Json | Set-Content .agent/build-logs/context.json -Encoding utf8
      - name: Retain safe outputs even after failure
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-producer-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .agent/build-logs/*
            dist/*.whl
            dist/installer/*/receipt.json
            dist/installer/*/payload/squirrel-windows/*
          if-no-files-found: warn
          retention-days: 7
